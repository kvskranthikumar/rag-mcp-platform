[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mcp-platform"
version = "0.1.0"
description = "Configurable document RAG platform with MCP, CLI, web, and ingestion interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "mcp>=1.2,<2",
    # document loaders
    "pymupdf>=1.26",
    "python-docx>=1.2",
    "beautifulsoup4>=4.12",
    "markdownify>=1.2,<2",
    "lxml>=5.2",
    "markdown-it-py>=3.0",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    # default hosted providers (embeddings/LLM)
    "openai>=1.30",
]

[project.optional-dependencies]
# Local embeddings + cross-encoder reranker (heavy; needs torch)
local = [
    "sentence-transformers>=3.0",
]
# Google Gemini answer LLM
gemini = [
    "google-generativeai>=0.7",
]
# Phase 3 web app
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
# Standalone drag-and-drop ingestion UI
# >=1.57 is required: Starlette replaced Tornado and `st.App(routes=...)`
# is how the /health endpoint is registered.
ingest-ui = [
    "streamlit>=1.57",
]
# Hosted MCP over streamable HTTP (uvicorn)
mcp-http = [
    "uvicorn[standard]>=0.30",
]
observability = [
    "langfuse>=4,<5",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.scripts]
rag-mcp-platform = "rag_mcp_platform.ingest.cli:main"
rag-mcp-platform-mcp = "rag_mcp_platform.mcp_server.server:main_stdio"
rag-mcp-platform-mcp-http = "rag_mcp_platform.mcp_server.server:main_http"
rag-mcp-platform-web = "rag_mcp_platform.web.app:main"
rag-mcp-platform-ingest-ui = "rag_mcp_platform.ingest_ui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_mcp_platform = ["web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
